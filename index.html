<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palloncini dell'Alfabeto</title>
<style>
  :root {
    --cielo-alto: #4fa8e0;
    --cielo-basso: #bfe4ff;
    --sole: #ffe066;
    --testo: #1b3a4b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    background: linear-gradient(to top, var(--cielo-basso), var(--cielo-alto));
    position: relative;
  }

  .sole {
    position: absolute;
    top: 30px;
    right: 40px;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: var(--sole);
    box-shadow: 0 0 40px 10px rgba(255, 224, 102, 0.7);
  }

  .nuvola {
    position: absolute;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 50px;
  }

  /* ---------- Pannello della parola in alto al centro ---------- */
  #pannello {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    text-align: center;
    pointer-events: none;
  }

  #istruzione {
    color: rgba(255,255,255,0.95);
    text-shadow: 0 2px 4px rgba(0,0,0,0.25);
    font-size: 1rem;
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  #parola {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .casella {
    width: 72px;
    height: 82px;
    border-radius: 10px;
    background: rgba(255,255,255,0.35);
    border: 3px solid rgba(255,255,255,0.75);
    color: rgba(255,255,255,0.9);
    font-size: 4rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.25s, transform 0.25s, color 0.25s, border-color 0.25s;
  }

  .casella.attiva {
    border-color: #fff;
    animation: pulsa 1.2s ease-in-out infinite;
  }

  .casella.trovata {
    background: #69db7c;
    border-color: #2f9e44;
    color: #fff;
    transform: scale(1.08);
  }

  #parola.completata .casella {
    animation: festeggia 0.5s ease-out;
  }

  @keyframes pulsa {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.6); }
    50%      { transform: scale(1.06); box-shadow: 0 0 0 10px rgba(255,255,255,0); }
  }

  @keyframes festeggia {
    0%   { transform: scale(1.08) rotate(0deg); }
    30%  { transform: scale(1.25) rotate(-6deg); }
    60%  { transform: scale(1.25) rotate(6deg); }
    100% { transform: scale(1.08) rotate(0deg); }
  }

  #punteggio {
    position: absolute;
    top: 16px;
    left: 70px;
    background: rgba(255, 255, 255, 0.75);
    color: var(--testo);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 1.05rem;
    font-weight: bold;
    z-index: 10;
    transition: left 0.3s;
  }

  /* ---------- Palloncini ---------- */
  .palloncino {
    position: absolute;
    bottom: -160px;
    width: 90px;
    height: 110px;
    cursor: pointer;
    transform: translateX(-50%);
    animation-name: sali;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    user-select: none;
  }

  .palloncino .corpo {
    width: 100%;
    height: 100%;
    border-radius: 50% 50% 48% 48%;
    position: relative;
    box-shadow: inset -8px -10px 15px rgba(0,0,0,0.15), inset 8px 8px 15px rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .palloncino .lettera {
    font-size: 2.6rem;
    font-weight: bold;
    color: rgba(255,255,255,0.97);
    text-shadow: 0 2px 3px rgba(0,0,0,0.25);
    pointer-events: none;
  }

  .palloncino .filo {
    position: absolute;
    top: 110px;
    left: 50%;
    width: 2px;
    height: 55px;
    background: rgba(80, 60, 40, 0.45);
    transform: translateX(-50%);
  }

  .palloncino.sbagliato .corpo {
    animation: trema 0.4s ease;
  }

  @keyframes trema {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-8px) rotate(-6deg); }
    40% { transform: translateX(8px) rotate(6deg); }
    60% { transform: translateX(-6px) rotate(-4deg); }
    80% { transform: translateX(6px) rotate(4deg); }
  }

  @keyframes sali {
    from { bottom: -160px; }
    to   { bottom: 110%; }
  }

  /* ---------- Effetto scoppio ---------- */
  .scoppio {
    position: absolute;
    width: 90px;
    height: 90px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 30;
  }
  .scoppio span {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--frammento, #fff);
    animation: espandi 0.5s ease-out forwards;
  }
  @keyframes espandi {
    from { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    to   { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.3); opacity: 0; }
  }

  /* ---------- Messaggio "Bravo!" ---------- */
  #messaggio {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    font-size: 3.2rem;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 4px 10px rgba(0,0,0,0.3);
    opacity: 0;
    pointer-events: none;
    z-index: 40;
    transition: opacity 0.3s, transform 0.3s;
  }
  #messaggio.visibile {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* ---------- Menu a scomparsa (per chi somministra il gioco) ---------- */
  #bottone-menu {
    position: absolute;
    top: 14px;
    left: 14px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.85);
    color: var(--testo);
    font-size: 1.3rem;
    cursor: pointer;
    z-index: 60;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  #menu {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 240px;
    background: rgba(255,255,255,0.97);
    box-shadow: 3px 0 12px rgba(0,0,0,0.2);
    z-index: 55;
    padding: 70px 20px 20px;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
  }

  #menu.aperto {
    transform: translateX(0);
  }

  #menu h2 {
    font-size: 1rem;
    color: var(--testo);
    margin: 0 0 14px;
  }

  .voce-gruppo {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    margin-bottom: 8px;
    border-radius: 10px;
    border: 2px solid transparent;
    background: #f1f3f5;
    color: var(--testo);
    font-size: 0.95rem;
    font-weight: bold;
    cursor: pointer;
  }

  .voce-gruppo:hover {
    background: #e9ecef;
  }

  .voce-gruppo.selezionato {
    border-color: #4dabf7;
    background: #e7f5ff;
  }

  .voce-gruppo .conteggio {
    font-weight: normal;
    color: #868e96;
    font-size: 0.8rem;
  }

  @media (max-width: 600px) {
    .casella { width: 38px; height: 46px; font-size: 1.4rem; border-width: 2px; }
    #parola { gap: 6px; }
    .palloncino { width: 70px; height: 86px; }
    .palloncino .lettera { font-size: 2rem; }
    #menu { width: 200px; }
  }
</style>
</head>
<body>

<div class="sole"></div>

<button id="bottone-menu" title="">&#9776;</button>

<div id="menu">
  <h2></h2>
  <div id="lista-gruppi"></div>
</div>

<div id="punteggio">Parole completate: 0</div>

<div id="pannello">
  <div id="istruzione">Scoppia le lettere in ordine</div>
  <div id="parola"></div>
</div>

<div id="messaggio"></div>
<div id="cielo"></div>

<script>
  /* =========================================================
     GRUPPI DI PAROLE
     ========================================================= */

  const GRUPPI = {
    "Quattro": ["CASA", "CANE", "CARO", "BENE", "BICI", "BACO", "DATO", "DITO", "FAME", "FILO", "GARA", "GELO", "LAGO", "LUNA", "LATO", "MARE", "MESE", "NERO", "NAVE", "PANE", "PERO", "RISO", "RANA", "SALE", "SOLE", "TIMO", "TOPO", "VASO", "VINO", "ZIO", "ZUCCA", "CERA", "CIMA", "COSA", "FOCA", "FUGA", "MURO", "MOLA", "NOCE", "PEPE", "ANNO", "ANNA", "ENNE", "INNI", "OTTO", "OTTE", "OTTO", "ESSE", "OSSA", "ISSI", "ALLA", "ALLO", "ALLE", "ILLE", "AMME", "IMMO", "AMMA", "AGGO", "EGLI", "AGGI", "UGGI", "ECCO", "ACCA", "ICCI", "UCCA", "EBBE", "ABBA", "OBBO", "EFFE", "UFFA", "AFFI", "ARRA", "ERRE", "IRRI", "URRO", "AZZA", "OZZO", "AZZE", "EPPE", "IPPO"],
    "Cinque - Sei": ["PESTO", "PISTA", "POSTO", "PUSTA", "BASTA", "RESTO", "BUSTA", "COSTA", "CASTO", "CESTO", "CESTA", "CISTA", "CONTO", "CANTA", "DENTE", "DENTE", "DENTO", "FESTA", "FUSTO", "GAMBA", "GAMBO", "GUSTO", "LAMPA", "LAMPO", "LENTO", "MANTA", "MONTE", "MENTA", "NASTRO", "MESTO", "PANCA", "PONTE", "PUNTO", "RAMPA", "RESTO", "SESTO", "TENDA", "TEMPO", "VAMPA", "PASTA", "BANANA", "PECORA", "PAPERA", "TAVOLA", "TAVOLO", "CAMERA", "DOMINO", "NUMERO", "VENERE", "LIMONE", "MELONE", "PILOTA", "MINUTO", "DENARO", "PAROLA", "LAVORO", "SAPORE", "RUMORE", "COLORE", "GIRONE", "GIRARE", "GELATO", "MAGICA", "FAGIANO", "VALICO", "SABATO", "SATANA", "RAPINA", "CATENA", "CADERE", "POTERE", "SEDERE", "VIVERE", "FIDARE", "BADARE", "GODERE", "NOTARE", "VOTARE", "ZOCCOLO", "VELENO"],
    "Doppie - Quadri": ["PALLONE", "MATTINA", "GATTINO", "BELLINO", "BOTTONE", "CAPPELLO", "PENNELLO", "RAGAZZO", "RAGAZZA", "CARRETTA", "BARRETTA", "SERRATA", "TERRENA", "COLLETTO", "SACCHETTO", "PACCHETTO", "PICCINO", "SECCARE", "FUMETTO", "FIAMMATA", "FIACCOLA", "SOMMATO", "COMMEDIA", "DILEMMA", "CAMMELLO", "BATTELLO", "MAMMOLA", "GENNAIO", "DONNINA", "PANNOSO", "ROTELLA", "GONNELLA", "SPINOTTO", "PANETTO", "LUNETTA", "CANNETO", "PINZETTA", "MINACCIA", "PALLIDA", "TORRONE", "TELEFONO", "TAVOLINO", "QUADERNO", "CIOCCOLATO", "BICICLETTA", "MARGHERITA", "MATITONE", "GELATERIA", "TELEVISORE", "SUPERMERCATO", "PRIMAVERA", "BIBLIOTECA", "PALLONCINO", "CARAMELLA", "CAMERETTA", "LIMONATA", "POMODORO", "AEROPLANO", "MONTAGNA", "FARFALLA", "CORRIDORE", "DISEGNO", "SCRIVANIA", "FRIGORIFERO", "MATEMATICA", "ITALIANO", "AVVENTURA", "OMBRELLO", "PAGLIACCIO", "GIRASOLE", "ARCOBALENO", "CARABINA", "TAMBURO", "MACEDONIA", "PATATINA", "CUCCHIAIO", "LAVATRICE", "GIORNALAIO", "DENTIERA", "ZAINETTO"],
    "Gruppi": ["SCIMMIA", "SCIROPPO", "SCIVOLO", "SCIOPERO", "SCIALLE", "SCIAME", "SCIENZA", "SCIOGLIERE", "FIGLIO", "FOGLIO", "MAGLIA", "CONIGLIO", "BOTTIGLIA", "FAMIGLIA", "PAGLIA", "SVEGLIA", "BAGNO", "LEGNO", "SOGNO", "DISEGNO", "RAGNO", "CASTAGNO", "MONTAGNA", "CAMPAGNA", "CHIAVE", "CHILO", "CHIESA", "CHIOCCIOLA", "CHIUSO", "CHIAMARE", "CHITARRA", "CHIARO", "GHIACCIO", "GHISA", "GHIRO", "GHIRLANDA", "GHIRIGORO", "GHIGNO", "UNGHIA", "FUNGHI"],
    "Non parole": ["BLAN", "DRIM", "FLOS", "GRED", "PRUT", "STAC", "CRIV", "PLOF", "BREN", "SCUD", "GLIM", "TRAN", "FRAL", "SNOP", "TRUS", "SMED", "BLIT", "DRAP", "FLEN", "GRIS", "PRAF", "SCOB", "TRIM", "CLAF", "BROG", "SNAL", "FRIM", "GLAP", "TREP", "SPLON", "DRUF", "BLOS", "CRUN", "SMIP", "TRAL", "FLUP", "GREN", "PLIM", "SCAF", "BRUD","LAMITO", "PENUCA", "TAROPE", "MISADO", "FURELA", "GANIPO", "SELUNA", "DORIME", "PAVIRO", "TUNEGA", "CARIMO", "BALENOZA", "SIMATO", "LUNEPO", "MARIDE", "FONECA", "RIPADO", "TEMULO", "VASINOPE", "NALUDO", "GIRAME", "POLENA", "BISARO", "TERUGA", "MOLIPE", "SANURO", "PELIMO", "RINATOPE", "DESULO", "TAPINE", "LORAME", "MINAPO", "SERUTO", "VALINE", "TORAPE", "ZANULO", "FENIRO", "LAPIDEGO", "MURAPO", "SILENOPE"]
  };

  // Alfabeto italiano (senza J K W X Y, che non servono a queste parole)
  const ALFABETO = "ABCDEFGHILMNOPQRSTUVZ".split("");
  const COLORI = ["#ff6b6b", "#ffa94d", "#ffd43b", "#69db7c", "#4dabf7", "#9775fa", "#f783ac"];

  const NUMERO_PALLONCINI = 9;

  /* =========================================================
     STATO DEL GIOCO
     ========================================================= */

  const cielo = document.getElementById("cielo");
  const parolaEl = document.getElementById("parola");
  const istruzioneEl = document.getElementById("istruzione");
  const punteggioEl = document.getElementById("punteggio");
  const messaggioEl = document.getElementById("messaggio");
  const bottoneMenu = document.getElementById("bottone-menu");
  const menuEl = document.getElementById("menu");
  const listaGruppiEl = document.getElementById("lista-gruppi");

  let nomeGruppoAttivo = Object.keys(GRUPPI)[0];
  let parolaCorrente = "";
  let indiceLettera = 0;
  let paroleCompletate = 0;
  let inPausa = false;

  /* =========================================================
     MENU LATERALE
     ========================================================= */

  function paroleGruppoAttivo() {
    return GRUPPI[nomeGruppoAttivo] || [];
  }

  function disegnaMenu() {
    listaGruppiEl.innerHTML = "";
    Object.keys(GRUPPI).forEach(function (nome) {
      const voce = document.createElement("button");
      voce.className = "voce-gruppo" + (nome === nomeGruppoAttivo ? " selezionato" : "");
      const n = GRUPPI[nome].length;
      voce.innerHTML = nome + ' <span class="conteggio">(' + n + (n === 1 ? " parola" : " parole") + ")</span>";
      voce.addEventListener("click", function () {
        selezionaGruppo(nome);
      });
      listaGruppiEl.appendChild(voce);
    });
  }

  function selezionaGruppo(nome) {
    if (nome === nomeGruppoAttivo) return;
    nomeGruppoAttivo = nome;
    disegnaMenu();
    menuEl.classList.remove("aperto");
    nuovaParola();
  }

  bottoneMenu.addEventListener("click", function () {
    menuEl.classList.toggle("aperto");
  });

  document.addEventListener("click", function (e) {
    if (!menuEl.contains(e.target) && e.target !== bottoneMenu && menuEl.classList.contains("aperto")) {
      menuEl.classList.remove("aperto");
    }
  });

  /* =========================================================
     PAROLA IN ALTO
     ========================================================= */

  function nuovaParola() {
    const elenco = paroleGruppoAttivo();

    if (elenco.length === 0) {
      parolaCorrente = "";
      indiceLettera = 0;
      istruzioneEl.textContent = "Aggiungi parole al \"" + nomeGruppoAttivo + "\" per iniziare";
      parolaEl.innerHTML = "";
      return;
    }

    istruzioneEl.textContent = "Scoppia le lettere in ordine";

    let scelta;
    do {
      scelta = elenco[Math.floor(Math.random() * elenco.length)];
    } while (scelta === parolaCorrente && elenco.length > 1);

    parolaCorrente = scelta;
    indiceLettera = 0;
    disegnaParola();
  }

  function disegnaParola() {
    parolaEl.innerHTML = "";
    parolaEl.classList.remove("completata");

    for (let i = 0; i < parolaCorrente.length; i++) {
      const casella = document.createElement("div");
      casella.className = "casella";
      casella.textContent = parolaCorrente[i];

      if (i < indiceLettera) {
        casella.classList.add("trovata");
      } else if (i === indiceLettera) {
        casella.classList.add("attiva");
      }

      parolaEl.appendChild(casella);
    }
  }

  function letteraDaCercare() {
    return parolaCorrente ? parolaCorrente[indiceLettera] : null;
  }

  /* =========================================================
     PALLONCINI
     ========================================================= */

  function coloreCasuale() {
    return COLORI[Math.floor(Math.random() * COLORI.length)];
  }

  function letteraPresenteInCielo(lettera) {
    return [...cielo.querySelectorAll(".palloncino")]
      .some(p => p.dataset.lettera === lettera);
  }

  function scegliLettera() {
    const serve = letteraDaCercare();

    if (serve && !letteraPresenteInCielo(serve)) return serve;

    if (serve && Math.random() < 0.35 && parolaCorrente) {
      return parolaCorrente[Math.floor(Math.random() * parolaCorrente.length)];
    }
    return ALFABETO[Math.floor(Math.random() * ALFABETO.length)];
  }

  function creaPalloncino() {
    const palloncino = document.createElement("div");
    palloncino.className = "palloncino";

    const lettera = scegliLettera();
    palloncino.dataset.lettera = lettera;

    const posizioneX = 8 + Math.random() * 84;
    palloncino.style.left = posizioneX + "%";

    const durata = 9 + Math.random() * 6;
    palloncino.style.animationDuration = durata + "s";

    const colore = coloreCasuale();
    palloncino.dataset.colore = colore;

    palloncino.innerHTML =
      '<div class="filo"></div>' +
      '<div class="corpo" style="background:' + colore + '">' +
        '<span class="lettera">' + lettera + '</span>' +
      '</div>';

    // Quando arriva in cima senza essere scoppiato: sparisce e ne nasce
    // un altro dopo una piccola pausa casuale (non tutti insieme)
    palloncino.addEventListener("animationend", function () {
      palloncino.remove();
      programmaNuovoPalloncino();
    });

    palloncino.addEventListener("click", function () {
      cliccaPalloncino(palloncino);
    });

    cielo.appendChild(palloncino);
  }

  // Crea un nuovo palloncino dopo un piccolo ritardo casuale, cosi la
  // comparsa risulta piu naturale invece che tutta insieme
  function programmaNuovoPalloncino(minMs, maxMs) {
    const min = minMs || 200;
    const max = maxMs || 1400;
    const ritardo = min + Math.random() * (max - min);
    setTimeout(creaPalloncino, ritardo);
  }

  function cliccaPalloncino(palloncino) {
    if (inPausa || !parolaCorrente) return;

    if (palloncino.dataset.lettera === letteraDaCercare()) {
      scoppia(palloncino);
      avanzaParola();
    } else {
      palloncino.classList.add("sbagliato");
      setTimeout(function () {
        palloncino.classList.remove("sbagliato");
      }, 400);
    }
  }

  function scoppia(palloncino) {
    const rect = palloncino.getBoundingClientRect();
    const centroX = rect.left + rect.width / 2;
    const centroY = rect.top + rect.height / 2;
    const colore = palloncino.dataset.colore;

    const scoppioEl = document.createElement("div");
    scoppioEl.className = "scoppio";
    scoppioEl.style.left = centroX + "px";
    scoppioEl.style.top = centroY + "px";

    for (let i = 0; i < 10; i++) {
      const frammento = document.createElement("span");
      const angolo = (Math.PI * 2 * i) / 10;
      const distanza = 40 + Math.random() * 25;
      frammento.style.setProperty("--dx", Math.cos(angolo) * distanza + "px");
      frammento.style.setProperty("--dy", Math.sin(angolo) * distanza + "px");
      frammento.style.setProperty("--frammento", colore);
      scoppioEl.appendChild(frammento);
    }

    document.body.appendChild(scoppioEl);
    setTimeout(function () { scoppioEl.remove(); }, 550);

    palloncino.remove();
    // dopo uno scoppio il rimpiazzo puo arrivare un filo piu veloce
    programmaNuovoPalloncino(150, 900);
  }

  function avanzaParola() {
    indiceLettera++;

    if (indiceLettera >= parolaCorrente.length) {
      completaParola();
    } else {
      disegnaParola();
    }
  }

  function completaParola() {
    disegnaParola();
    parolaEl.classList.add("completata");

    paroleCompletate++;
    punteggioEl.textContent = "Parole completate: " + paroleCompletate;

    mostraMessaggio(parolaCorrente);

    inPausa = true;
    setTimeout(function () {
      inPausa = false;
      nuovaParola();
    }, 1600);
  }

  function mostraMessaggio(testo) {
    messaggioEl.textContent = testo;
    messaggioEl.classList.add("visibile");
    setTimeout(function () {
      messaggioEl.classList.remove("visibile");
    }, 1400);
  }

  /* =========================================================
     SCENOGRAFIA
     ========================================================= */

  function creaNuvola(top, left, scala) {
    const nuvola = document.createElement("div");
    nuvola.className = "nuvola";
    nuvola.style.top = top + "px";
    nuvola.style.left = left + "px";
    nuvola.style.width = (90 * scala) + "px";
    nuvola.style.height = (30 * scala) + "px";
    document.body.appendChild(nuvola);

    const misure = [[50, -20, 10], [40, -12, 45]];
    misure.forEach(function (m) {
      const bolla = document.createElement("div");
      bolla.style.position = "absolute";
      bolla.style.background = "inherit";
      bolla.style.borderRadius = "50%";
      bolla.style.width = (m[0] * scala) + "px";
      bolla.style.height = (m[0] * scala) + "px";
      bolla.style.top = (m[1] * scala) + "px";
      bolla.style.left = (m[2] * scala) + "px";
      nuvola.appendChild(bolla);
    });
  }

  creaNuvola(200, 60, 1);
  creaNuvola(320, 300, 0.7);
  creaNuvola(250, 620, 1.1);

  /* =========================================================
     AVVIO
     ========================================================= */

  disegnaMenu();
  nuovaParola();

  // Lancio iniziale con ritardi casuali crescenti, invece che tutti
  // insieme a intervalli fissi: risulta piu naturale
  let accumulo = 0;
  for (let i = 0; i < NUMERO_PALLONCINI; i++) {
    accumulo += 200 + Math.random() * 500;
    setTimeout(creaPalloncino, accumulo);
  }

  // Rete di sicurezza: ogni 2 secondi controlla che la lettera da cercare
  // sia davvero presente in cielo, altrimenti ne fa comparire una subito
  setInterval(function () {
    if (inPausa) return;
    const serve = letteraDaCercare();
    if (serve && !letteraPresenteInCielo(serve)) creaPalloncino();
  }, 2000);
</script>
